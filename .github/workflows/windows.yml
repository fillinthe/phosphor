# Windows build of Phosphor: on every push to main (code changes) and by hand. scripts/release-github.sh attaches
# this run's zip to a release when it built the same commit.
# FFmpeg comes from BtbN's prebuilt shared Windows build (n9.0, matching ffmpeg-next 9); its DLLs ship next to the exe.
name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "ROADMAP.md"

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: FFmpeg (BtbN n9.0 shared)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath $env:RUNNER_TEMP
          $dir = Get-ChildItem $env:RUNNER_TEMP -Directory | Where-Object Name -like "ffmpeg-n9.0*" | Select-Object -First 1
          "FFMPEG_DIR=$($dir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$($dir.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          # bindgen needs libclang
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: win-${{ hashFiles('Cargo.lock') }}

      - name: Engine and ISF crates
        run: cargo test -p phosphor-engine -p phosphor-isf --release

      - name: App
        run: cargo build -p phosphor --release

      - name: App tests
        shell: pwsh
        run: |
          # The sound test's movie (media/test/av.mp4 isn't in git): 2.5 s test card, a 1 kHz beep at 1.0-1.1 s.
          ffmpeg -v error -y -f lavfi -i "testsrc=size=320x180:rate=30:duration=2.5" -f lavfi -i "sine=frequency=1000:sample_rate=48000:duration=2.5" -af "volume=enable='not(between(t,1.0,1.1))':volume=0" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest media/test/av.mp4
          cargo test -p phosphor --release --bins

      - name: Package (exe + FFmpeg DLLs)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\Phosphor | Out-Null
          Copy-Item target\release\phosphor.exe dist\Phosphor\Phosphor.exe
          Copy-Item "$env:FFMPEG_DIR\bin\*.dll" dist\Phosphor\
          Copy-Item "$env:FFMPEG_DIR\bin\ffmpeg.exe" dist\Phosphor\
          Copy-Item -Recurse assets\isf dist\Phosphor\isf
          Copy-Item -Recurse assets\gl-transitions dist\Phosphor\gl-transitions
          Compress-Archive -Path dist\Phosphor -DestinationPath dist\Phosphor-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Phosphor-windows
          path: dist/Phosphor-windows.zip

      # NDI's free redistributable runtime, so the launch test can send and find NDI (not shipped in the zip).
      - name: NDI Runtime
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest "https://ndi.link/NDIRedistV6" -OutFile ndi-runtime.exe
          Start-Process ndi-runtime.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Get-ChildItem "$env:ProgramFiles\NDI" -Recurse -Filter "Processing.NDI.Lib.x64.dll" | Select-Object -ExpandProperty FullName

      # Smoke test: open the packaged app on the runner's software GPU (WARP) with a small mapped project (two
# generators, two slices, a soft mask), run a few seconds, save a picture.
      # Reported, not blocking: a runner without a usable GPU says nothing about real PCs.
      - name: Launch test
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 4
        env:
          WGPU_BACKEND: dx12
        run: |
          $p = Start-Process dist\Phosphor\Phosphor.exe -ArgumentList "--bench","4","--ndi","--project","scripts\\ci\\smoke.phosphor","--snapshot","$PWD\dist\win-snapshot.png" -PassThru -NoNewWindow -RedirectStandardOutput dist\launch.txt -RedirectStandardError dist\launch-err.txt
          if (-not $p.WaitForExit(150000)) { $p.Kill(); "TIMEOUT" | Out-File -Append dist\launch.txt }
          "exit code: $($p.ExitCode)" | Out-File -Append dist\launch.txt
          Get-Content dist\launch.txt | Select-String "SUMMARY|LAYERS|LAYER_ERROR|NDI|GPU|panicked|exit code|TIMEOUT"
          Get-Content dist\launch-err.txt -Tail 30
          if (-not (Test-Path dist\win-snapshot.png)) { exit 1 }

      # Export Show: pack the test project into a show folder, then run the exported exe on its own.
      - name: Export Show test
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 5
        run: |
          New-Item -ItemType Directory -Force dist\export | Out-Null
          $p = Start-Process dist\Phosphor\Phosphor.exe -ArgumentList "--bench","2","--project","$PWD\scripts\ci\smoke.phosphor","--export","$PWD\dist\export" -PassThru -NoNewWindow -RedirectStandardOutput dist\export.txt
          if (-not $p.WaitForExit(120000)) { $p.Kill() }
          Get-Content dist\export.txt | Select-String "EXPORT"
          Get-ChildItem "dist\export\Bench Show" | Select-Object -First 8 -ExpandProperty Name
          $q = Start-Process "dist\export\Bench Show\Bench Show.exe" -ArgumentList "--bench","3" -PassThru -NoNewWindow -RedirectStandardOutput dist\export-run.txt
          if (-not $q.WaitForExit(120000)) { $q.Kill() }
          Get-Content dist\export-run.txt | Select-String "LAYERS|SUMMARY|LAYER_ERROR"
          if (-not (Select-String -Path dist\export-run.txt -Pattern "Plasma" -Quiet)) { exit 1 }

      # Codecs: make a short clip in each common format with this FFmpeg and play each through Phosphor
      # (the Mac runs the same list with scripts/codec-test.sh).
      - name: Codec test
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 20
        env:
          WGPU_BACKEND: dx12
        run: |
          $d = "$env:RUNNER_TEMP\codecs"; New-Item -ItemType Directory -Force $d | Out-Null
          $ff = "dist\Phosphor\ffmpeg.exe"
          $clips = [ordered]@{
            "h264.mp4" = "-c:v libx264 -pix_fmt yuv420p"; "h264_422_10bit.mov" = "-c:v libx264 -pix_fmt yuv422p10le"
            "hevc.mp4" = "-c:v libx265 -tag:v hvc1 -pix_fmt yuv420p"; "hevc_10bit.mov" = "-c:v libx265 -pix_fmt yuv420p10le -tag:v hvc1"
            "av1.mp4" = "-c:v libsvtav1 -pix_fmt yuv420p"; "vp8.webm" = "-c:v libvpx"; "vp9.webm" = "-c:v libvpx-vp9"
            "vp9_alpha.webm" = "-c:v libvpx-vp9 -pix_fmt yuva420p"; "prores422.mov" = "-c:v prores_ks -profile:v 2"
            "prores4444_alpha.mov" = "-c:v prores_ks -profile:v 4 -pix_fmt yuva444p10le"; "dnxhr.mxf" = "-c:v dnxhd -profile:v dnxhr_sq -pix_fmt yuv422p"
            "mjpeg.avi" = "-c:v mjpeg -q:v 3 -pix_fmt yuvj420p"; "mpeg2.mpg" = "-c:v mpeg2video"; "mpeg4.avi" = "-c:v mpeg4"
            "cineform.mov" = "-c:v cfhd"; "qtrle_animation.mov" = "-c:v qtrle"; "png.mov" = "-c:v png"; "animation.gif" = "-c:v gif"
            "ffv1.mkv" = "-c:v ffv1"; "utvideo.avi" = "-c:v utvideo"; "huffyuv.avi" = "-c:v huffyuv"; "wmv2.wmv" = "-c:v wmv2"
          }
          foreach ($k in $clips.Keys) {
            $a = "-hide_banner -loglevel error -y -f lavfi -i testsrc2=size=640x352:rate=30 -t 3 $($clips[$k]) $d\$k"
            Start-Process $ff -ArgumentList $a -NoNewWindow -Wait
          }
          Start-Process $ff -ArgumentList "-hide_banner -loglevel error -y -f lavfi -i testsrc2=size=640x352:rate=30 -t 3 -c:v dxv -pix_fmt rgba $d\dxv.mov" -NoNewWindow -Wait
          $ok = 0; $bad = 0
          foreach ($f in Get-ChildItem $d) {
            $out = "$env:RUNNER_TEMP\codec-out.txt"
            $p = Start-Process dist\Phosphor\Phosphor.exe -ArgumentList "--bench","3","--window","480x300","--movie",$f.FullName -PassThru -NoNewWindow -RedirectStandardOutput $out
            if (-not $p.WaitForExit(90000)) { $p.Kill() }
            $line = (Get-Content $out | Select-String "^VIDEO|^LAYER_ERROR" | Select-Object -First 1)
            if ("$line" -like "VIDEO*") { $ok++ } else { $bad++ }
            "{0,-24} {1}" -f $f.Name, "$line" | Tee-Object -Append -FilePath dist\codecs.txt
          }
          "CODECS $ok played, $bad failed" | Tee-Object -Append -FilePath dist\codecs.txt

      # Spout: does a receiver built from the official Spout SDK get Phosphor's picture?
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Spout test
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 6
        run: |
          git clone --depth 1 https://github.com/leadedge/Spout2 $env:RUNNER_TEMP\Spout2
          $sdk = "$env:RUNNER_TEMP\Spout2\SPOUTSDK"
          $gl = "$sdk\SpoutGL"
          cl /nologo /EHsc /std:c++17 /O2 /DNDEBUG /I"$sdk\SpoutDirectX\SpoutDX" /I"$gl" scripts\ci\spout_receiver.cpp "$sdk\SpoutDirectX\SpoutDX\SpoutDX.cpp" "$gl\SpoutDirectX.cpp" "$gl\SpoutSenderNames.cpp" "$gl\SpoutSharedMemory.cpp" "$gl\SpoutFrameCount.cpp" "$gl\SpoutCopy.cpp" "$gl\SpoutUtils.cpp" /Fe:dist\spout_receiver.exe /link d3d11.lib dxgi.lib winmm.lib shlwapi.lib advapi32.lib user32.lib gdi32.lib shell32.lib version.lib psapi.lib
          if (-not (Test-Path dist\spout_receiver.exe)) { "SPOUT_RX receiver didn't build" | Out-File dist\spout.txt; exit 1 }
          $p = Start-Process dist\Phosphor\Phosphor.exe -ArgumentList "--bench","40","--project","$PWD\scripts\ci\spout.phosphor" -PassThru -NoNewWindow -RedirectStandardOutput dist\spout-phosphor.txt -RedirectStandardError dist\spout-phosphor-err.txt
          dist\spout_receiver.exe Phosphor | Tee-Object -FilePath dist\spout.txt
          $rx = $LASTEXITCODE
          if (-not $p.WaitForExit(90000)) { $p.Kill() }
          Get-Content dist\spout-phosphor.txt | Select-String "SPOUT|SUMMARY|panicked"
          Get-Content dist\spout-phosphor-err.txt -Tail 15
          exit $rx

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-test
          path: |
            dist/codecs.txt
            dist/win-snapshot*.png
            dist/launch.txt
            dist/launch-err.txt
            dist/spout*.txt
            dist/export*.txt
          if-no-files-found: ignore
