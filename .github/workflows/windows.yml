# Windows build of Phosphor: on every push to main (code changes) and by hand. scripts/release-github.sh attaches
# this run's zip to a release when it built the same commit.
# FFmpeg comes from BtbN's prebuilt shared Windows build (n9.0, matching ffmpeg-next 9); its DLLs ship next to the exe.
name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: FFmpeg (BtbN n9.0 shared)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath $env:RUNNER_TEMP
          $dir = Get-ChildItem $env:RUNNER_TEMP -Directory | Where-Object Name -like "ffmpeg-n9.0*" | Select-Object -First 1
          "FFMPEG_DIR=$($dir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$($dir.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          # bindgen needs libclang
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: win-${{ hashFiles('Cargo.lock') }}

      - name: Engine and ISF crates
        run: cargo test -p phosphor-engine -p phosphor-isf --release

      - name: App
        run: cargo build -p phosphor --release

      - name: Package (exe + FFmpeg DLLs)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\Phosphor | Out-Null
          Copy-Item target\release\phosphor.exe dist\Phosphor\Phosphor.exe
          Copy-Item "$env:FFMPEG_DIR\bin\*.dll" dist\Phosphor\
          Copy-Item "$env:FFMPEG_DIR\bin\ffmpeg.exe" dist\Phosphor\
          Compress-Archive -Path dist\Phosphor -DestinationPath dist\Phosphor-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Phosphor-windows
          path: dist/Phosphor-windows.zip

      # Smoke test: open the packaged app on the runner's software GPU (WARP), run a few seconds, save a picture.
      # Reported, not blocking: a runner without a usable GPU says nothing about real PCs.
      - name: Launch test
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 4
        env:
          WGPU_BACKEND: dx12
        run: |
          $p = Start-Process dist\Phosphor\Phosphor.exe -ArgumentList "--bench","4","--snapshot","$PWD\dist\win-snapshot.png" -PassThru -NoNewWindow -RedirectStandardOutput dist\launch.txt -RedirectStandardError dist\launch-err.txt
          if (-not $p.WaitForExit(150000)) { $p.Kill(); "TIMEOUT" | Out-File -Append dist\launch.txt }
          "exit code: $($p.ExitCode)" | Out-File -Append dist\launch.txt
          Get-Content dist\launch.txt | Select-String "SUMMARY|LAYER_ERROR|GPU|panicked|exit code|TIMEOUT"
          Get-Content dist\launch-err.txt -Tail 30
          if (-not (Test-Path dist\win-snapshot.png)) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-test
          path: |
            dist/win-snapshot.png
            dist/launch.txt
            dist/launch-err.txt
          if-no-files-found: ignore
