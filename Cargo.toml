[workspace]
resolver = "3"
members = ["crates/phosphor-engine", "crates/phosphor", "crates/phosphor-isf", "crates/gamp-vis"]
exclude = ["vendor"]

[profile.release]
lto = "thin"
codegen-units = 1
# Unwind (not abort) so a third-party shader that crashes the converter only skips that shader.

[profile.dev.package."*"]
opt-level = 2

# eframe with patches ("PHOSPHOR PATCH"): a hidden control window keeps rendering the outputs at full rate on macOS
# (src/native/run.rs), and `eframe::monitors()` lists winit's screens for the app (lib.rs, native/mod.rs: Linux has no
# other way to list them). Re-apply when upgrading eframe.
[patch.crates-io]
eframe = { path = "vendor/eframe" }
# egui + epaint with one patch each ("PHOSPHOR PATCH"): interface translation (epaint text/fonts.rs `translation`,
# applied when a galley is laid out) and text fields kept untranslated (egui text_edit/builder.rs).
egui = { path = "vendor/egui" }
epaint = { path = "vendor/epaint" }
# egui_dock with one patch ("PHOSPHOR PATCH", widgets/dock_area/show/leaf.rs): a tab's close X takes the tab's text
# colour (black on the focused tab's colour fill). Re-apply when upgrading egui_dock.
egui_dock = { path = "vendor/egui_dock" }
# winit with one patch ("PHOSPHOR PATCH", platform_impl/windows/monitor.rs): a monitor that was just unplugged or
# went to sleep gives no name / a 0×0 size instead of panicking (egui-winit asks every frame). Re-apply on upgrade.
winit = { path = "vendor/winit" }
# egui-wgpu with patches ("PHOSPHOR PATCH", src/winit.rs): a window surface the driver refuses to set up (OpenGL on
# old Intel graphics, Windows) skips its frames and is tried again every 2 s instead of ending the app; and each
# window's present mode can be its own (`winit::PRESENT_MODE_FOR`, asked by Phosphor's present.rs). Re-apply on upgrade.
egui-wgpu = { path = "vendor/egui-wgpu" }
