[workspace]
resolver = "3"
members = ["crates/phosphor-engine", "crates/phosphor", "crates/phosphor-isf", "crates/gamp-vis"]
exclude = ["vendor"]

[profile.release]
lto = "thin"
codegen-units = 1
# Unwind (not abort) so a third-party shader that crashes the converter only skips that shader.

[profile.dev.package."*"]
opt-level = 2

# eframe with one patch (vendor/eframe/src/native/run.rs, "PHOSPHOR PATCH"): a hidden control
# window keeps rendering the outputs at full rate on macOS. Re-apply when upgrading eframe.
[patch.crates-io]
eframe = { path = "vendor/eframe" }
# egui + epaint with one patch each ("PHOSPHOR PATCH"): interface translation (epaint text/fonts.rs `translation`,
# applied when a galley is laid out) and text fields kept untranslated (egui text_edit/builder.rs).
egui = { path = "vendor/egui" }
epaint = { path = "vendor/epaint" }
# egui_dock with one patch ("PHOSPHOR PATCH", widgets/dock_area/show/leaf.rs): a tab's close X takes the tab's text
# colour (black on the focused tab's colour fill). Re-apply when upgrading egui_dock.
egui_dock = { path = "vendor/egui_dock" }
