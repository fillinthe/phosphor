[package]
name = "phosphor-engine"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2024"
description = "Phosphor real-time video engine (wgpu: Metal natively, WebGPU in the browser)"

[dependencies]
# Single-stroke letters for laser text (Hershey fonts; acknowledgement shown in the Lasers panel and the README).
vector-text-core = "0.1"
vector-text-hershey = "0.1"
earcutr = "0.5"
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
bytemuck = { version = "1.25", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
naga = { version = "30", features = ["wgsl-in"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["wgsl", "webgpu"] }


[dev-dependencies]
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dev-dependencies]
wgpu = { version = "30", features = ["metal"] }
