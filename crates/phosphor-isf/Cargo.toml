[package]
name = "phosphor-isf"
version = "0.1.0"
edition = "2024"
description = "ISF (Interactive Shader Format) importer: GLSL -> WGSL for Phosphor"

[dependencies]
naga = { version = "30", features = ["glsl-in", "wgsl-out", "wgsl-in"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
