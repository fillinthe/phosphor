[package]
name = "phosphor"
version = "0.2.91"
license = "GPL-3.0-or-later"
edition = "2024"

[dependencies]
phosphor-engine = { path = "../phosphor-engine" }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
serde_json = "1"
ron = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
log = "0.4"
egui_dock = { version = "0.21", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
web-time = "1"
ehttp = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
egui-phosphor = "0.14"
ab_glyph = "0.2"
ttf-parser = "0.25"
epaint_default_fonts = "0.36"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Game controllers as control sources (buttons, sticks, triggers).
gilrs = "0.11"
phosphor-isf = { path = "../phosphor-isf" }
rfd = "0.17"
libc = "0.2"
env_logger = "0.11"
ffmpeg-next = { version = "9.0", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling", "device"] }
cpal = "0.18.2"
rustfft = "6.4.1"
midir = "0.11"
rosc = "0.11"
mdns-sd = "0.21"
flate2 = "1"
roxmltree = "0.20"
rusty_link = "0.4"
tungstenite = "0.26"
qrcode = { version = "0.14.1", default-features = false }
pollster = "0.4"
snap = "1"

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl"] }
objc2 = "0.6"
muda = { version = "0.21", default-features = false }
screencapturekit = "11"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSArray", "NSEnumerator"] }
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice", "MTLTexture", "MTLResource", "MTLCommandQueue", "MTLCommandBuffer", "MTLAllocation"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNRequest", "VNRequestHandler", "VNObservation", "VNDetectFaceRectanglesRequest", "VNDetectHumanHandPoseRequest", "VNDetectHumanBodyPoseRequest", "VNDetectedPoint", "VNGeometry", "VNTypes", "VNGeneratePersonSegmentationRequest", "VNStatefulRequest", "objc2-core-video", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVPixelBuffer", "CVBuffer", "CVImageBuffer", "CVReturn", "CVBase"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_Security", "Win32_System_ProcessStatus", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "HtmlInputElement", "Blob", "BlobPropertyBag", "Url", "File", "FileList"] }


[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
