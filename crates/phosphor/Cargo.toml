[package]
name = "phosphor"
version = "0.1.0"
edition = "2024"

[dependencies]
phosphor-engine = { path = "../phosphor-engine" }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
log = "0.4"
egui_dock = { version = "0.21", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
web-time = "1"
egui-phosphor = "0.14"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
phosphor-isf = { path = "../phosphor-isf" }
rfd = "0.17"
libc = "0.2"
env_logger = "0.11"
ffmpeg-next = { version = "9.0", default-features = false, features = ["codec", "format", "software-scaling"] }
cpal = "0.18.2"
rustfft = "6.4.1"
midir = "0.11"
rosc = "0.11"
mdns-sd = "0.21"
tungstenite = "0.26"
qrcode = { version = "0.14.1", default-features = false }
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry"] }
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice", "MTLTexture", "MTLResource", "MTLCommandQueue", "MTLCommandBuffer", "MTLAllocation"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }

