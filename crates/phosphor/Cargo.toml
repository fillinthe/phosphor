[package]
name = "phosphor"
version = "0.2.36"
license = "GPL-3.0-or-later"
edition = "2024"

[dependencies]
phosphor-engine = { path = "../phosphor-engine" }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
serde_json = "1"
ron = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
log = "0.4"
egui_dock = { version = "0.21", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
web-time = "1"
ehttp = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
egui-phosphor = "0.14"
ab_glyph = "0.2"
ttf-parser = "0.25"
epaint_default_fonts = "0.36"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
phosphor-isf = { path = "../phosphor-isf" }
rfd = "0.17"
libc = "0.2"
env_logger = "0.11"
ffmpeg-next = { version = "9.0", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling", "device"] }
cpal = "0.18.2"
rustfft = "6.4.1"
midir = "0.11"
rosc = "0.11"
mdns-sd = "0.21"
flate2 = "1"
roxmltree = "0.20"
rusty_link = "0.4"
tungstenite = "0.26"
qrcode = { version = "0.14.1", default-features = false }
pollster = "0.4"
snap = "1"

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl"] }
objc2 = "0.6"
muda = { version = "0.21", default-features = false }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSArray", "NSEnumerator"] }
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice", "MTLTexture", "MTLResource", "MTLCommandQueue", "MTLCommandBuffer", "MTLAllocation"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "HtmlInputElement", "Blob", "BlobPropertyBag", "Url", "File", "FileList"] }

