[package]
name = "phosphor"
version = "0.3.2"
license = "GPL-3.0-or-later"
edition = "2024"

[features]
# Screen and window capture and system sound (ScreenCaptureKit: macOS 12.3 and later). The build for older Intel Macs
# leaves it out (--no-default-features); Phosphor then says screen capture needs a newer macOS.
default = ["screencapture"]
screencapture = ["dep:screencapturekit"]

[dependencies]
phosphor-engine = { path = "../phosphor-engine" }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
serde_json = "1"
ron = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "exr", "hdr", "tga", "qoi"] }
log = "0.4"
egui_dock = { version = "0.21", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
web-time = "1"
ehttp = "0.6"
roxmltree = "0.20"
egui-phosphor = "0.14"
ab_glyph = "0.2"
ttf-parser = "0.25"
epaint_default_fonts = "0.36"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# HTTPS for the session server (net_tls): not in the browser build (ring doesn't build for wasm without getrandom's js feature).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# Game controllers as control sources (buttons, sticks, triggers).
gilrs = "0.11"
phosphor-isf = { path = "../phosphor-isf" }
rfd = "0.17"
libc = "0.2"
env_logger = "0.11"
# SVG pictures as layers and clips.
resvg = "0.45"
# Lottie (After Effects) animations: velato parses and animates them, drawn here with tiny-skia (no GPU renderer).
velato = { version = "0.12", default-features = false }
kurbo = "0.13"
peniko = "0.6"
base64 = "0.22"
# Elgato Stream Deck keys / dials as controller input, key pictures as feedback (HID).
elgato-streamdeck = "0.14"
# MilkDrop presets (.milk) as layers: a MilkDrop engine on wgpu, rendering on Phosphor's own GPU device.
lactea = "0.2"
# Online media libraries (Library > Online): searches and downloads streamed to disk (already used by ehttp).
ureq = "2"
ffmpeg-next = { version = "9.0", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling", "device"] }
cpal = "0.18.2"
rustfft = "6.4.1"
midir = "0.11"
rosc = "0.11"
mdns-sd = "0.21"
flate2 = "1"
rusty_link = "0.4"
tungstenite = "0.26"
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
qrcode = { version = "0.14.1", default-features = false }
pollster = "0.4"
snap = "1"

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl"] }
objc2 = "0.6"
muda = { version = "0.21", default-features = false }
# Display / window capture and system sound (macOS 12.3+); off in the build for older Intel Macs.
screencapturekit = { version = "11", optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSArray", "NSEnumerator"] }
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice", "MTLTexture", "MTLResource", "MTLCommandQueue", "MTLCommandBuffer", "MTLAllocation"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNRequest", "VNRequestHandler", "VNObservation", "VNDetectFaceRectanglesRequest", "VNDetectHumanHandPoseRequest", "VNDetectHumanBodyPoseRequest", "VNDetectedPoint", "VNGeometry", "VNTypes", "VNGeneratePersonSegmentationRequest", "VNStatefulRequest", "VNDetectBarcodesRequest", "VNRecognizeTextRequest", "objc2-core-video", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVPixelBuffer", "CVBuffer", "CVImageBuffer", "CVReturn", "CVBase"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux (Raspberry Pi player): a window system for winit, and Vulkan for wgpu.
eframe = { version = "0.36.2", default-features = false, features = ["x11", "wayland"] }
wgpu = { version = "30", default-features = false, features = ["vulkan", "wgsl"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_Security", "Win32_System_ProcessStatus", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "HtmlInputElement", "Blob", "BlobPropertyBag", "Url", "File", "FileList"] }


[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
