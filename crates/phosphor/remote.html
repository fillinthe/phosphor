<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141618">
<title>Phosphor Remote</title>
<style>
  :root { --bg:#141618; --card:#1d2023; --line:#2c3034; --ink:#e6e6e6; --dim:#8a9096; --acc:#78ffaa; --warn:#ff8c5a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:14px -apple-system, system-ui, sans-serif; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 64px) env(safe-area-inset-left); }
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--bg); border-bottom:1px solid var(--line); }
  header b { color:var(--acc); letter-spacing:.08em; }
  #dot { width:9px; height:9px; border-radius:50%; background:var(--warn); }
  #dot.on { background:var(--acc); }
  header .sp { flex:1; }
  button { background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px 14px; font:inherit; touch-action:manipulation; }
  button.on { background:#1d3a2a; border-color:var(--acc); color:var(--acc); }
  button.big { font-weight:600; }
  #tap { color:var(--acc); }
  #prev { width:100%; display:block; background:#000; aspect-ratio:16/9; object-fit:contain; }
  #prevwrap.off #prev { display:none; }
  .section { padding:10px 12px; }
  .row { display:flex; align-items:center; gap:10px; }
  .fader { position:relative; background:#30353a; border-radius:12px; overflow:hidden; touch-action:none; cursor:pointer; }
  .fader .fill { position:absolute; background:linear-gradient(90deg,#2a7a52,var(--acc)); }
  .fader.h { height:40px; flex:1; }
  .fader.h .fill { left:0; top:0; bottom:0; }
  .fader.v { width:48px; height:220px; }
  .fader.v .fill { left:0; right:0; bottom:0; background:linear-gradient(0deg,#2a7a52,var(--acc)); }
  .fader.drag { outline:2px solid #fff; }
  .label { color:var(--dim); font-size:12px; min-width:64px; }
  .val { font-variant-numeric: tabular-nums; color:var(--dim); font-size:12px; min-width:38px; text-align:right; }
  /* mixer */
  #strips { display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; scroll-snap-type:x mandatory; }
  .strip { flex:0 0 92px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px; display:flex; flex-direction:column; align-items:center; gap:8px; scroll-snap-align:start; }
  .strip.sel { border-color:var(--acc); }
  .strip img.th, #selth { display:block; width:76px; aspect-ratio:16/9; object-fit:cover; border-radius:6px; background:#000; }
  .strip img.th:not([src]) { visibility:hidden; }
  #selth { width:100%; max-height:38vh; aspect-ratio:auto; object-fit:contain; margin-bottom:6px; }
  #selth:not([src]) { display:none; }
  #timing { padding:10px 10px; color:var(--dim); }
  #timing.on { color:var(--acc); border-color:var(--acc); background:#1d3a2a; }
  .strip .name { font-size:12px; font-weight:600; max-width:84px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .strip .btns { display:flex; gap:4px; }
  .strip .btns button { padding:6px 8px; font-size:12px; }
  /* clips */
  #clips { overflow-x:auto; }
  table { border-collapse:separate; border-spacing:6px; }
  td, th { padding:0; }
  .cell { width:86px; height:56px; border-radius:10px; background:var(--card); border:1px solid var(--line); color:var(--ink); font-size:11px; padding:4px; overflow:hidden; }
  .cell.empty { color:#444; }
  .cell.active { border-color:var(--acc); background:#1d3a2a; color:var(--acc); }
  .lname { font-size:12px; color:var(--dim); max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:right; padding-right:4px; }
  th button { width:86px; padding:8px 0; }
  /* params */
  .fxhead { margin:14px 0 2px; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
  nav { position:fixed; left:0; right:0; bottom:0; display:flex; background:#101214; border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); z-index:6; }
  nav button { flex:1; border:none; border-radius:0; background:transparent; padding:14px 0; color:var(--dim); }
  nav button.on { color:var(--acc); background:transparent; }
  .page { display:none; } .page.on { display:block; }
  #surface { display:grid; gap:6px; }
  #surftabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  #surftabs:empty { display:none; }
  #surftabs button { padding:8px 14px; border-radius:10px; border:1px solid var(--line); background:transparent; color:inherit; font:inherit; }
  #surftabs button.on { background:var(--accent, #5be89a); color:#06140c; border-color:transparent; }
  #surface .w { border-radius:12px; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; text-align:center;
                font-size:13px; user-select:none; -webkit-user-select:none; touch-action:none; position:relative; overflow:hidden; }
  #surface .w.lbl { border:none; font-weight:600; }
  #surface .fader.v, #surface .fader.h { width:auto; height:auto; flex:none; }
  #surface .cap { position:absolute; left:6px; top:4px; font-size:11px; color:#fff; pointer-events:none; z-index:2; }
  #surface .xy .dot { position:absolute; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; pointer-events:none; }
  /* View-only: big picture, no controls, a password box. */
  body.viewonly nav, body.viewonly .page, body.viewonly #mastersec, body.viewonly #tap { display:none !important; }
  body.viewonly #prevwrap #prev { display:block !important; height:calc(100vh - 180px); aspect-ratio:auto; }
  #lock { display:none; padding:12px; gap:8px; align-items:center; }
  body.viewonly #lock { display:flex; flex-wrap:wrap; }
  #lock input { flex:1; min-width:140px; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px; font:inherit; }
  #lockmsg { width:100%; color:var(--dim); font-size:12px; }
  .hint { color:var(--dim); font-size:12px; }
  #support { text-align:center; padding-top:18px; } #support a { color:#ff8ca0; text-decoration:none; }
  /* Audience play (/play): the Control Surface, clip columns and Surprise, one guest at a time. */
  #play, #playbtns { display:none; }
  body.guest #play, body.guest #playbtns { display:block; }
  body.guest nav, body.guest #mastersec, body.guest #tap, body.guest #timing, body.guest #lock, body.guest #prevwrap,
  body.guest .page:not(#p-surface), body.guest.fixedpage #surftabs { display:none !important; }
  body.guest #p-surface { display:block; }
  body.guest.locked #surface, body.guest.locked #playbtns { pointer-events:none; opacity:.35; filter:grayscale(1); }
  #playtitle { font-size:22px; font-weight:700; letter-spacing:.02em; }
  #playstat { margin-top:6px; font-size:16px; color:var(--dim); }
  #playstat b { color:var(--acc); }
  #playclock { font-variant-numeric: tabular-nums; font-size:40px; font-weight:700; color:var(--ink); margin-top:4px; }
  body.guest.locked #playclock { color:var(--dim); }
  #playcols { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  #playcols button, #playsurprise { flex:1; min-width:64px; padding:16px 0; font-size:16px; font-weight:600; }
  #playsurprise { width:100%; background:#2b1d3a; border-color:#b78cff; color:#d9c3ff; }
</style>
</head>
<body>
<header>
  <div id="dot"></div><b>PHOSPHOR</b><span class="hint" id="status">connecting…</span>
  <span class="sp"></span>
  <span class="val" id="bpm">120</span>
  <button id="timing" title="When clips land: now, on the beat or on the bar">Now</button>
  <button id="tap" class="big">TAP</button>
</header>
<div id="lock">
  <div id="lockmsg">Watching only. Enter the password to control.</div>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button id="pwgo" class="big">Unlock</button>
</div>
<div id="prevwrap"><img id="prev" alt=""></div>
<div id="play"><div class="section"><div id="playtitle"></div><div id="playstat"></div><div id="playclock"></div></div></div>
<div class="section" id="mastersec">
  <div class="row"><span class="label">MASTER</span><div id="master"></div><span class="val" id="masterv"></span></div>
</div>
<div class="page" id="p-surface"><div class="section"><div id="surftabs"></div><div id="surface"></div><p class="hint" id="surfhint"></p></div></div>
<div id="playbtns"><div class="section"><div id="playcols"></div><button id="playsurprise">Surprise me</button></div></div>
<div class="page on" id="p-mixer"><div class="section"><div id="strips"></div></div></div>
<div class="page" id="p-clips"><div class="section"><div id="clips"></div><p class="hint">Tap a cell to trigger · tap a number to trigger the whole column</p></div></div>
<div class="page" id="p-ctrl"><div class="section"><img id="selth" alt=""><div id="params"></div></div></div>
<footer class="section hint" id="support">Phosphor is free and open source · <a href="https://phosphorfx.com/donate/" target="_blank" rel="noopener">&#9829; Support it</a></footer>
<nav>
  <button data-p="surface">Surface</button>
  <button data-p="mixer" class="on">Mixer</button>
  <button data-p="clips">Clips</button>
  <button data-p="ctrl">Controls</button>
  <button id="pv">Preview</button>
</nav>
<script>
let ws = null, state = null, touching = new Set(), pending = new Map(), raf = 0;
// Audience play: /play is the same page in guest mode. `me` is this phone's seat; the Mac says whose turn it is.
const guest = location.pathname.startsWith('/play');
let me = null, endsAt = null, wasMine = false, thanksUntil = 0;
if (guest) { document.body.classList.add('guest', 'locked'); document.title = 'Phosphor · Play'; }
const $ = s => document.querySelector(s);
const send = m => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); };
// Coalesce slider moves to one message per animation frame per control.
function queue(key, msg) { pending.set(key, msg); if (!raf) raf = requestAnimationFrame(() => { raf = 0; pending.forEach(m => send(m)); pending.clear(); }); }
// Touch faders drawn with divs: they track the finger exactly on iOS/Android and never scroll the page.
function fader(key, min, max, value, onInput, vertical) {
  const t = document.createElement('div'); t.className = 'fader ' + (vertical ? 'v' : 'h'); t.dataset.key = key;
  const f = document.createElement('div'); f.className = 'fill'; t.appendChild(f);
  t.setValue = v => { t.value = v; const p = ((v - min) / (max - min) * 100) + '%'; if (vertical) f.style.height = p; else f.style.width = p; };
  t.setValue(value);
  const at = e => {
    const r = t.getBoundingClientRect();
    const k = vertical ? 1 - (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width;
    const v = min + Math.min(1, Math.max(0, k)) * (max - min);
    t.setValue(v); onInput(v);
  };
  t.addEventListener('pointerdown', e => { touching.add(key); t.classList.add('drag'); try { t.setPointerCapture(e.pointerId); } catch (_) {} at(e); e.preventDefault(); });
  t.addEventListener('pointermove', e => { if (t.hasPointerCapture(e.pointerId)) at(e); });
  const end = () => { t.classList.remove('drag'); setTimeout(() => touching.delete(key), 300); };
  t.addEventListener('pointerup', end); t.addEventListener('pointercancel', end);
  return t;
}
const slider = (key, min, max, value, onInput) => fader(key, min, max, value, onInput, false);
function setIfIdle(el, v) { if (el && !touching.has(el.dataset.key)) el.setValue(v); }

function render() {
  if (!state) return;
  if (guest) renderPlay();
  $('#bpm').textContent = state.bpm.toFixed(1) + ' bpm';
  const tb = $('#timing'); tb.textContent = { Now: 'Now', Beat: 'Beat', Bar: 'Bar' }[state.timing] || 'Now'; tb.classList.toggle('on', state.timing && state.timing !== 'Now');
  setIfIdle($('#master'), state.master); $('#masterv').textContent = Math.round(state.master * 100) + '%';
  // Mixer strips (rebuilt only when the layer set changes).
  const sig = state.layers.map(l => l.id + l.name).join('|') + '|' + state.selected;
  const strips = $('#strips');
  if (strips.dataset.sig !== sig) {
    strips.dataset.sig = sig; strips.innerHTML = '';
    state.layers.forEach(l => {
      const d = document.createElement('div'); d.className = 'strip' + (l.id === state.selected ? ' sel' : ''); d.dataset.id = l.id;
      const n = document.createElement('div'); n.className = 'name'; n.textContent = l.name; n.onclick = () => send({ t: 'select', layer: l.id });
      const th = document.createElement('img'); th.className = 'th'; th.alt = ''; th.onclick = n.onclick;
      const vw = fader('op' + l.id, 0, 1, l.opacity, v => queue('op' + l.id, { t: 'opacity', layer: l.id, v }), true);
      const val = document.createElement('div'); val.className = 'val'; val.dataset.role = 'v';
      const b = document.createElement('div'); b.className = 'btns';
      const on = document.createElement('button'); on.textContent = 'ON'; on.dataset.role = 'on'; on.onclick = () => send({ t: 'enabled', layer: l.id, v: !on.classList.contains('on') });
      const so = document.createElement('button'); so.textContent = 'S'; so.dataset.role = 'solo'; so.onclick = () => send({ t: 'solo', layer: l.id, v: !so.classList.contains('on') });
      b.append(on, so); d.append(n, th, vw, val, b); strips.appendChild(d);
    });
  }
  state.layers.forEach(l => {
    const d = strips.querySelector(`[data-id="${l.id}"]`); if (!d) return;
    setIfIdle(d.querySelector('.fader'), l.opacity);
    d.querySelector('[data-role=v]').textContent = Math.round(l.opacity * 100) + '%';
    d.querySelector('[data-role=on]').classList.toggle('on', l.enabled);
    d.querySelector('[data-role=solo]').classList.toggle('on', l.solo);
    thumb(d.querySelector('img.th'), l);
  });
  thumb($('#selth'), state.layers.find(l => l.id === state.selected));
  // Clip grid.
  let h = '<table><tr><th></th>';
  for (let c = 0; c < state.columns; c++) h += `<th><button data-col="${c}">${c + 1}</button></th>`;
  h += '</tr>';
  state.layers.forEach(l => {
    h += `<tr><td class="lname">${esc(l.name)}</td>`;
    for (let c = 0; c < state.columns; c++) {
      const k = l.clips.find(x => x.slot === c);
      const cls = !k ? 'cell empty' : 'cell' + (k.active ? ' active' : '');
      h += `<td><button class="${cls}" data-layer="${l.id}" data-slot="${c}">${k ? esc(k.name) : '—'}</button></td>`;
    }
    h += '</tr>';
  });
  $('#clips').innerHTML = h + '</table>';
  // Controls for the selected layer.
  const sigp = state.params.map(p => p.key).join('|');
  const box = $('#params');
  if (box.dataset.sig !== sigp) {
    box.dataset.sig = sigp; box.innerHTML = '';
    if (!state.params.length) box.innerHTML = '<p class="hint">Pick a layer (tap its name in the Mixer) to control its source and effects here.</p>';
    let group = null;
    state.params.forEach(p => {
      if (p.group !== group) {
        group = p.group;
        const head = document.createElement('div'); head.className = 'fxhead'; head.textContent = group;
        if (p.fx) { const t = document.createElement('button'); t.textContent = 'ON'; t.dataset.fxon = p.fx; t.onclick = () => send({ t: 'fxon', effect: p.fx, v: !t.classList.contains('on') }); head.appendChild(t); }
        box.appendChild(head);
      }
      const row = document.createElement('div'); row.className = 'row';
      const lab = document.createElement('span'); lab.className = 'label'; lab.textContent = p.name;
      row.append(lab, slider(p.key, p.min, p.max, p.value, v => queue(p.key, Object.assign({}, p.msg, { v }))));
      box.appendChild(row);
    });
  }
  renderSurface();
  state.params.forEach(p => { const r = box.querySelector(`[data-key="${CSS.escape(p.key)}"]`); if (r) setIfIdle(r, p.value); if (p.fx) { const b = box.querySelector(`[data-fxon="${p.fx}"]`); if (b) b.classList.toggle('on', p.fxon); } });
}
function clock() {
  const el = $('#playclock');
  if (endsAt == null) { el.textContent = ''; return; }
  const s = Math.max(0, Math.round((endsAt - Date.now()) / 1000));
  el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
setInterval(clock, 500);
function renderPlay() {
  const p = state.play || {};
  $('#playtitle').textContent = p.title || 'Take the controls';
  const st = $('#playstat');
  const mine = p.on && me != null && p.current === me;
  endsAt = p.left == null ? null : Date.now() + p.left * 1000;
  if (!p.on) st.textContent = 'Audience play is off right now. Keep watching the screen!';
  else if (mine) st.innerHTML = '<b>Your turn!</b> Everything below changes the visuals' + (endsAt == null ? '.' : ' until the clock runs out.');
  else {
    const i = (p.queue || []).indexOf(me);
    const who = i < 0 ? 'Joining the line…' : i === 0 ? "<b>You're next.</b>" : `You're <b>${i + 1}</b> in line.`;
    st.innerHTML = who + (p.current == null ? '' : ' Someone is playing now.');
  }
  // The moment a turn ends: say thanks for a few seconds.
  if (wasMine && !mine && p.on) { $('#playstat').innerHTML = '<b>Thanks, that was you!</b> Next person\'s turn.'; thanksUntil = Date.now() + 4000; }
  else if (thanksUntil > Date.now() && !mine) { $('#playstat').innerHTML = '<b>Thanks, that was you!</b> Next person\'s turn.'; }
  wasMine = mine;
  document.body.classList.toggle('locked', !mine);
  document.body.classList.toggle('fixedpage', p.page != null);
  clock();
  const cols = $('#playcols');
  const n = p.columns || 0;
  if (+cols.dataset.n !== n) {
    cols.dataset.n = n; cols.innerHTML = '';
    for (let c = 0; c < n; c++) { const b = document.createElement('button'); b.dataset.col = c; b.textContent = c + 1; cols.appendChild(b); }
  }
  $('#playsurprise').style.display = p.surprise ? '' : 'none';
}
// Control Surface: the widgets you built on the Mac, on the same grid. Every move goes back as
// {t:'set', target, v} through the same path as the Mac's own controls.
function setTarget(target, v) { queue(JSON.stringify(target), { t: 'set', target, v }); }
let surfPage = Number(localStorage.getItem('surfPage') || 0); // each phone keeps its own page
function renderSurface() {
  const all = state.surface || { columns: 12, widgets: [], pages: ['Main'] };
  const pages = all.pages && all.pages.length ? all.pages : ['Main'];
  if (guest && state.play && state.play.page != null) surfPage = state.play.page;
  if (surfPage >= pages.length) surfPage = 0;
  const tabs = $('#surftabs');
  const tsig = pages.join('|') + '#' + surfPage;
  if (tabs.dataset.sig !== tsig) {
    tabs.dataset.sig = tsig; tabs.innerHTML = '';
    if (pages.length > 1) pages.forEach((name, i) => {
      const b = document.createElement('button'); b.textContent = name; if (i === surfPage) b.className = 'on';
      b.onclick = () => { surfPage = i; localStorage.setItem('surfPage', i); renderSurface(); };
      tabs.appendChild(b);
    });
  }
  const sf = { ...all, widgets: all.widgets.filter(w => (w.page || 0) === surfPage) };
  const box = $('#surface');
  const sig = surfPage + '#' + sf.columns + '|' + sf.widgets.map(w => [w.id, w.kind, w.x, w.y, w.w, w.h, w.label, w.color].join(',')).join('|');
  if (box.dataset.sig !== sig) {
    box.dataset.sig = sig; box.innerHTML = '';
    const cell = Math.max(28, (box.clientWidth || window.innerWidth - 24) / sf.columns - 6);
    box.style.gridTemplateColumns = `repeat(${sf.columns}, 1fr)`; box.style.gridAutoRows = cell + 'px';
    $('#surfhint').textContent = sf.widgets.length ? '' : 'No Control Surface yet. Build one on the Mac (Control Surface panel → Edit).';
    sf.widgets.forEach(w => {
      const X = { Surface: w.id }, Y = { SurfaceY: w.id };
      let el;
      if (w.kind === 'Fader' || w.kind === 'Slider') {
        el = fader('sf' + w.id, 0, 1, w.value, v => setTarget(X, v), w.kind === 'Fader');
        el.querySelector('.fill').style.background = w.color;
        const cap = document.createElement('span'); cap.className = 'cap'; cap.textContent = w.label; el.appendChild(cap);
      } else {
        el = document.createElement('div'); el.dataset.key = 'sf' + w.id;
        if (w.kind === 'Label') { el.className = 'w lbl'; el.style.color = w.color; el.textContent = w.label; }
        else if (w.kind === 'XyPad' || w.kind === 'Color') {
          el.className = 'w xy';
          // Colour: hue across, saturation up (grey at the bottom).
          el.style.background = w.kind === 'Color' ? 'linear-gradient(to top, #808080, rgba(128,128,128,0)), linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00)' : '#181b1e';
          const cap = document.createElement('span'); cap.className = 'cap'; cap.textContent = w.label;
          const dot = document.createElement('div'); dot.className = 'dot'; dot.style.background = w.color; el.append(cap, dot);
          el.setValue = (x, y) => { dot.style.left = (x * 100) + '%'; dot.style.top = ((1 - y) * 100) + '%'; };
          const at = e => { const r = el.getBoundingClientRect(); const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y = Math.min(1, Math.max(0, 1 - (e.clientY - r.top) / r.height)); el.setValue(x, y); setTarget(X, x); setTarget(Y, y); };
          el.addEventListener('pointerdown', e => { touching.add(el.dataset.key); try { el.setPointerCapture(e.pointerId); } catch (_) {} at(e); e.preventDefault(); });
          el.addEventListener('pointermove', e => { if (el.hasPointerCapture(e.pointerId)) at(e); });
          const end = () => setTimeout(() => touching.delete(el.dataset.key), 300);
          el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
          el.setValue(w.value, w.value_y);
        } else {
          el.className = 'w'; el.textContent = w.label; el.dataset.color = w.color;
          if (w.kind === 'Button') {
            const down = e => { send({ t: 'set', target: X, v: 1 }); el.classList.add('held'); try { el.setPointerCapture(e.pointerId); } catch (_) {} e.preventDefault(); };
            const up = () => { send({ t: 'set', target: X, v: 0 }); el.classList.remove('held'); };
            el.addEventListener('pointerdown', down); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
          } else {
            el.addEventListener('click', () => send({ t: 'set', target: X, v: -1 }));
          }
        }
      }
      el.style.gridColumn = `${w.x + 1} / span ${w.w}`; el.style.gridRow = `${w.y + 1} / span ${w.h}`;
      el.dataset.id = w.id; box.appendChild(el);
    });
  }
  sf.widgets.forEach(w => {
    const el = box.querySelector(`[data-id="${w.id}"]`); if (!el || touching.has(el.dataset.key)) return;
    if (w.kind === 'Fader' || w.kind === 'Slider') el.setValue(w.value);
    else if (w.kind === 'XyPad' || w.kind === 'Color') el.setValue(w.value, w.value_y);
    else if (w.kind === 'Button' || w.kind === 'Toggle') { const on = w.value > 0.5 || el.classList.contains('held'); el.style.background = on ? el.dataset.color : '#1b1f22'; el.style.color = on ? '#000' : '#eee'; el.style.borderColor = el.dataset.color; }
  });
}
// Layer pictures come as /thumb/<id>.jpg; the state carries a version so a picture only reloads when it changed.
function thumb(img, l) {
  if (!img) return;
  if (!l || !l.thumb) { if (img.hasAttribute('src')) img.removeAttribute('src'); return; }
  const src = `/thumb/${l.id}.jpg?v=${l.thumb}`;
  if (img.getAttribute('src') !== src) img.src = src;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.col !== undefined) send({ t: 'column', col: +t.dataset.col });
  if (t.dataset.slot !== undefined && !t.classList.contains('empty')) send({ t: 'clip', layer: +t.dataset.layer, slot: +t.dataset.slot });
  if (t.dataset.p) { document.querySelectorAll('nav button[data-p]').forEach(b => b.classList.toggle('on', b === t)); document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.id === 'p-' + t.dataset.p)); }
});
$('#tap').onclick = () => send({ t: 'tap' });
$('#playsurprise').onclick = () => send({ t: 'surprise' });
$('#timing').onclick = () => { const order = ['Now', 'Beat', 'Bar']; const cur = state ? state.timing : 'Now'; send({ t: 'timing', v: order[(order.indexOf(cur) + 1) % 3] }); };
const master = slider('master', 0, 1, 1, v => queue('master', { t: 'master', v }));
master.id = 'master'; $('#master').replaceWith(master);
$('#pv').onclick = () => { const w = $('#prevwrap'); w.classList.toggle('off'); $('#prev').src = w.classList.contains('off') ? '' : '/stream.mjpeg'; $('#pv').classList.toggle('on', !w.classList.contains('off')); };
$('#prevwrap').classList.add('off');

// Password: viewers without it get the picture only.
let viewOnly = false;
function auth(status) {
  if (status === 'ok') { setViewOnly(false); return; }
  setViewOnly(true);
  if (status === 'bad') { $('#lockmsg').textContent = 'Wrong password. Watching only.'; localStorage.removeItem('phosphor-pw'); return; }
  const saved = localStorage.getItem('phosphor-pw');
  if (saved) send({ t: 'auth', password: saved });
}
function setViewOnly(on) {
  viewOnly = on;
  document.body.classList.toggle('viewonly', on);
  $('#status').textContent = on ? 'watching' : 'connected';
  if (on) { $('#prevwrap').classList.remove('off'); $('#prev').src = '/stream.mjpeg'; }
}
$('#pwgo').onclick = () => { const p = $('#pw').value; localStorage.setItem('phosphor-pw', p); send({ t: 'auth', password: p }); };
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#pwgo').click(); });

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + (guest ? '/guest' : '/control'));
  ws.onopen = () => { $('#dot').classList.add('on'); $('#status').textContent = viewOnly ? 'watching' : 'connected'; };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.you !== undefined) { me = m.you; if (state) render(); return; }
    if (m.auth !== undefined) return auth(m.auth);
    state = m; render();
  };
  ws.onclose = () => { $('#dot').classList.remove('on'); $('#status').textContent = 'reconnecting…'; setTimeout(connect, 1000); };
}
connect();
</script>
